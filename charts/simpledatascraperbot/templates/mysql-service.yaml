{{- if .Values.mysql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sdsb.mysql.fullname" . }}
  labels:
    {{- include "sdsb.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    {{- include "sdsb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
{{- end }}
